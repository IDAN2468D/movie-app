name: Mobile CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: |
          if [ -d "./movie-app" ]; then cd ./movie-app; fi
          npm ci || npm install

      - name: Linting
        continue-on-error: true
        run: |
          if [ -d "./movie-app" ]; then cd ./movie-app; fi
          npm run lint

      - name: Type Check
        run: |
          if [ -d "./movie-app" ]; then cd ./movie-app; fi
          npx tsc

      - name: Run Tests
        run: |
          if [ -d "./movie-app" ]; then cd ./movie-app; fi
          npm test -- --passWithNoTests

  build_check:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          if [ -d "./movie-app" ]; then cd ./movie-app; fi
          npm ci || npm install

      - name: Build Dry Run (Android)
        run: |
          if [ -d "./movie-app" ]; then cd ./movie-app; fi
          npx eas build --platform android --profile development --non-interactive --local --no-wait
        continue-on-error: true

  deploy_preview:
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          if [ -d "./movie-app" ]; then cd ./movie-app; fi
          npm ci || npm install

      - name: Publish Update (CD)
        run: |
          if [ -d "./movie-app" ]; then cd ./movie-app; fi
          npx eas update --auto --non-interactive
